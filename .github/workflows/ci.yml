name: ci
on:
  pull_request:
  merge_group:

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compile
        run: cargo test --no-run --locked

      - name: Test
        run: cargo test -- --nocapture

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  compat:
    name: compat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compat

      # The dev shell has the Nix release rnix follows, and its language tests
      - name: Compare rnix's parser with Nix's
        run: nix develop .#compat --command cargo test --locked --manifest-path compat/Cargo.toml

      - name: Check compat's formatting
        run: nix develop .#compat --command cargo fmt --manifest-path compat/Cargo.toml -- --check

      - name: Run Clippy on compat
        run: >-
          nix develop .#compat --command
          cargo clippy --locked --manifest-path compat/Cargo.toml --all-targets -- -D warnings

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the node24 runtime of actions/github-script
          node-version: 24

      # .npmrc sets package-lock-only for local use, where `nix develop .#scripts` provides node_modules
      - name: Install dependencies
        run: npm ci --package-lock-only=false

      - name: Typecheck and test
        run: npm test
